name: Deploy auf Strato

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-strato
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Datenbank-Zugangsdaten für api.php
        env:
          DB_HOST: ${{ secrets.STRATO_DB_HOST }}
          DB_PORT: ${{ secrets.STRATO_DB_PORT }}
          DB_NAME: ${{ secrets.STRATO_DB_NAME }}
          DB_USER: ${{ secrets.STRATO_DB_USER }}
          DB_PASSWORD: ${{ secrets.STRATO_DB_PASSWORD }}
        run: |
          php -r 'echo "<?php\nreturn " . var_export([
            "host" => getenv("DB_HOST"),
            "port" => getenv("DB_PORT") ?: "",
            "name" => getenv("DB_NAME"),
            "user" => getenv("DB_USER"),
            "password" => getenv("DB_PASSWORD"),
          ], true) . ";\n";' > dist/api/config.php
          php -l dist/api/config.php

      - name: Per SFTP hochladen
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.STRATO_REMOTE_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            open -u \"$SFTP_USER\",\"$SFTP_PASSWORD\" sftp://$SFTP_HOST;
            mkdir -p -f \"$REMOTE_DIR\";
            mirror -R --verbose --parallel=4 dist/ \"$REMOTE_DIR\"
          "

      # Nur beim ersten Mal wirksam: übernimmt die alten Firebase-Daten, solange
      # die neue Datenbank noch leer ist, und tut danach nichts mehr.
      - name: Daten aus Firebase übernehmen
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          SITE_URL: ${{ secrets.STRATO_SITE_URL }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$SITE_URL" ]; then
            echo "VITE_FIREBASE_PROJECT_ID oder STRATO_SITE_URL fehlt - übersprungen."
            exit 0
          fi
          node scripts/migrate-from-firebase.mjs
